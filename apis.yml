name: Amazon Personalize
description: Amazon Personalize is a fully managed machine learning service that enables developers to create individualized recommendations for
  customers using their applications. Its control-plane API manages datasets, schemas, import and export jobs, solutions, campaigns, recommenders
  and filters, while the separate Personalize Runtime and Personalize Events APIs serve real-time recommendations and ingest interaction events,
  all signed with AWS Signature Version 4.
